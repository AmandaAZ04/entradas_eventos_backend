# Cambiar TU_IP_O_DOMINIO por la IP elástica o el dominio (sin http://).
server {
    listen 80;
    server_name TU_IP_O_DOMINIO;
    client_max_body_size 2m;

    # Nginx entrega CSS/JS de Encore, Django Admin y DRF.
    location /static/ {
        alias /var/www/entradas_eventos/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://unix:/run/entradas_eventos/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 100s;
    }

    access_log /var/log/nginx/entradas_eventos_access.log;
    error_log /var/log/nginx/entradas_eventos_error.log;
}
